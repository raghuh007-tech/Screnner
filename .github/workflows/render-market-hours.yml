name: F&O scanner market-hours schedule

on:
  schedule:
    # 9:15 AM IST = 03:45 UTC, Monday to Friday
    - cron: "45 3 * * 1-5"
    # 3:00 PM IST = 09:30 UTC, Monday to Friday
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Manual action"
        required: true
        type: choice
        options:
          - resume
          - suspend

jobs:
  control-render:
    runs-on: ubuntu-latest
    steps:
      - name: Resume scanner at market open
        if: (github.event_name == 'schedule' && github.event.schedule == '45 3 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.action == 'resume')
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY" || (echo "Missing GitHub Actions secret: RENDER_API_KEY" && exit 1)
          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.render.com/v1/services/srv-dbpb980m7kps73ae4h5g/resume" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json"

      - name: Suspend scanner after market close
        if: (github.event_name == 'schedule' && github.event.schedule == '30 9 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.action == 'suspend')
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY" || (echo "Missing GitHub Actions secret: RENDER_API_KEY" && exit 1)
          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.render.com/v1/services/srv-dbpb980m7kps73ae4h5g/suspend" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json"
