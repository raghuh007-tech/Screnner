name: F&O scanner Render market-hours controls

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-market-hours.yml"
  schedule:
    # Resume attempts: 8:45, 8:50, 8:55, 9:00 and 9:05 IST (Mon-Fri).
    # Early checks provide a startup buffer; the dashboard remains market-hours gated.
    - cron: "15 3 * * 1-5"
    - cron: "20 3 * * 1-5"
    - cron: "25 3 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "35 3 * * 1-5"
    # Suspend attempts: 3:00, 3:05, 3:10, 3:15 and 3:20 PM IST (Mon-Fri).
    - cron: "30 9 * * 1-5"
    - cron: "35 9 * * 1-5"
    - cron: "40 9 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "50 9 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Manual service action"
        required: true
        type: choice
        options:
          - resume
          - suspend
          - verify

# Avoid two start/stop requests racing each other.
concurrency:
  group: render-market-hours-control
  cancel-in-progress: false

jobs:
  control-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile Render service state
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-dbpb980m7kps73ae4h5g
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
          MANUAL_ACTION: ${{ inputs.action || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$RENDER_API_KEY" || {
            echo "Missing GitHub Actions secret: RENDER_API_KEY" >&2
            exit 1
          }

          API_BASE="https://api.render.com/v1/services/$SERVICE_ID"
          API_BODY=""
          API_HTTP_CODE="000"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_ACTION="$MANUAL_ACTION"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            TARGET_ACTION="verify"
          else
            case "$SCHEDULE_CRON" in
              "15 3 * * 1-5"|"20 3 * * 1-5"|"25 3 * * 1-5"|"30 3 * * 1-5"|"35 3 * * 1-5")
                TARGET_ACTION="resume"
                ;;
              "30 9 * * 1-5"|"35 9 * * 1-5"|"40 9 * * 1-5"|"45 9 * * 1-5"|"50 9 * * 1-5")
                TARGET_ACTION="suspend"
                ;;
              *)
                echo "Unrecognised scheduled event: $SCHEDULE_CRON" >&2
                exit 1
                ;;
            esac
          fi

          if [[ "$TARGET_ACTION" != "resume" && "$TARGET_ACTION" != "suspend" && "$TARGET_ACTION" != "verify" ]]; then
            echo "Invalid action: $TARGET_ACTION" >&2
            exit 1
          fi
          echo "Requested Render action: $TARGET_ACTION"
          echo "Schedule event: ${SCHEDULE_CRON:-manual}"

          api_request() {
            local method="$1"
            local url="$2"
            local attempt delay tmp http rc
            API_BODY=""
            API_HTTP_CODE="000"

            for attempt in 1 2 3; do
              tmp="$(mktemp)"
              if http="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "$tmp" --write-out '%{http_code}' \
                --request "$method" \
                --header "Authorization: Bearer $RENDER_API_KEY" \
                --header "Accept: application/json" \
                "$url")"; then
                rc=0
              else
                rc=$?
                http="${http:-000}"
              fi

              API_BODY="$(cat "$tmp" 2>/dev/null || true)"
              rm -f "$tmp"
              API_HTTP_CODE="$http"

              if [[ "$rc" -eq 0 && "$http" =~ ^2[0-9][0-9]$ ]]; then
                return 0
              fi

              if [[ "$rc" -ne 0 || "$http" == "429" || "$http" =~ ^5[0-9][0-9]$ ]]; then
                if [[ "$attempt" -lt 3 ]]; then
                  delay=$((attempt * 10))
                  echo "Temporary Render API issue (HTTP $http); retrying in ${delay}s..."
                  sleep "$delay"
                  continue
                fi
              fi

              echo "Render API request failed (HTTP $http): $API_BODY" >&2
              return 1
            done
            return 1
          }

          read_service_state() {
            api_request GET "$API_BASE"
            SERVICE_STATUS="$(jq -r '.suspended // empty' <<<"$API_BODY")"
            SERVICE_SUSPENDERS="$(jq -c '.suspenders // []' <<<"$API_BODY")"
            if [[ -z "$SERVICE_STATUS" ]]; then
              echo "Render response did not contain a suspension state: $API_BODY" >&2
              return 1
            fi
            echo "Render state: $SERVICE_STATUS; suspenders: $SERVICE_SUSPENDERS"
          }

          wait_for_state() {
            local desired="$1"
            local attempt actual
            for attempt in $(seq 1 18); do
              if read_service_state; then
                actual="$SERVICE_STATUS"
                if [[ "$actual" == "$desired" ]]; then
                  echo "Confirmed Render state: $desired"
                  return 0
                fi
              fi
              echo "Waiting for Render state '$desired' (check $attempt/18)..."
              sleep 10
            done
            echo "Render did not reach the requested state '$desired'." >&2
            return 1
          }

          wait_for_dashboard_health() {
            local attempt code body tmp
            for attempt in $(seq 1 24); do
              tmp="$(mktemp)"
              if code="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
                --output "$tmp" --write-out '%{http_code}' \
                "https://fyers-fno-live-screener.onrender.com/health")"; then
                body="$(cat "$tmp" 2>/dev/null || true)"
              else
                code="000"
                body=""
              fi
              rm -f "$tmp"

              if [[ "$code" == "200" ]] && jq -e '.ok == true' >/dev/null 2>&1 <<<"$body"; then
                echo "Dashboard health check passed."
                return 0
              fi
              echo "Dashboard is not healthy yet (HTTP $code); check $attempt/24."
              sleep 10
            done
            echo "Render resumed but dashboard health did not become ready within four minutes." >&2
            return 1
          }

          if ! read_service_state; then
            echo "Could not read initial Render service state." >&2
            exit 1
          fi

          if [[ "$TARGET_ACTION" == "verify" ]]; then
            echo "Push/manual verification only; no service lifecycle action will be taken."
            if [[ "$SERVICE_STATUS" == "not_suspended" ]]; then
              wait_for_dashboard_health
            else
              echo "Service is suspended; skipping HTTP health check because this may be outside market hours."
            fi
          elif [[ "$TARGET_ACTION" == "resume" ]]; then
            if [[ "$SERVICE_STATUS" == "not_suspended" ]]; then
              echo "Render is already active; no resume request needed."
            elif [[ "$SERVICE_STATUS" == "suspended" ]]; then
              echo "Requesting Render resume..."
              if ! api_request POST "$API_BASE/resume"; then
                RESUME_ERROR="$API_BODY"
                # A manual action might have changed the state while the request was in flight.
                if read_service_state && [[ "$SERVICE_STATUS" == "not_suspended" ]]; then
                  echo "Render became active during the request; treating this as success."
                else
                  if [[ "$RESUME_ERROR" == *"only services suspended by a user can be resumed"* ]]; then
                    echo "Render rejected resume because this suspension is not eligible for API resume." >&2
                    echo "Render API response: $RESUME_ERROR" >&2
                    echo "Observed suspenders: $SERVICE_SUSPENDERS" >&2
                    echo "Manual intervention is required in the Render Dashboard." >&2
                  fi
                  exit 1
                fi
              else
                echo "Resume request accepted (HTTP $API_HTTP_CODE)."
              fi
              wait_for_state "not_suspended"
            else
              echo "Unexpected Render suspension state: $SERVICE_STATUS" >&2
              exit 1
            fi
            wait_for_dashboard_health
          else
            if [[ "$SERVICE_STATUS" == "suspended" ]]; then
              echo "Render is already suspended; no suspend request needed."
            elif [[ "$SERVICE_STATUS" == "not_suspended" ]]; then
              echo "Requesting Render suspend..."
              if ! api_request POST "$API_BASE/suspend"; then
                # Accept a concurrent/manual suspend only if the state confirms it.
                if read_service_state && [[ "$SERVICE_STATUS" == "suspended" ]]; then
                  echo "Render became suspended during the request; treating this as success."
                else
                  exit 1
                fi
              else
                echo "Suspend request accepted (HTTP $API_HTTP_CODE)."
              fi
              wait_for_state "suspended"
            else
              echo "Unexpected Render suspension state: $SERVICE_STATUS" >&2
              exit 1
            fi
          fi

          echo "Market-hours control completed successfully."

      - name: Add failure instructions
        if: failure()
        run: |
          {
            echo "## Render market-hours control failed"
            echo ""
            echo "Check this job's logs and the Render service events."
            echo "The workflow verifies both the Render suspension state and the dashboard health endpoint."
          } >> "$GITHUB_STEP_SUMMARY"
