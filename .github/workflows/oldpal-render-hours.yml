name: Oldpal Render Market Hours

on:
  schedule:
    # 9:00 AM IST (03:30 UTC), Monday-Friday
    - cron: "30 3 * * 1-5"
    # 3:00 PM IST (09:30 UTC), Monday-Friday
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Service action"
        required: true
        type: choice
        options:
          - resume
          - suspend

jobs:
  manage-render-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume at market open
        if: github.event_name == 'schedule' && github.event.schedule == '30 3 * * 1-5' || github.event_name == 'workflow_dispatch' && inputs.action == 'resume'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Missing GitHub secret RENDER_API_KEY"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/srv-dbpb980m7kps73ae4h5g/resume" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY"

      - name: Suspend after market close
        if: github.event_name == 'schedule' && github.event.schedule == '30 9 * * 1-5' || github.event_name == 'workflow_dispatch' && inputs.action == 'suspend'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Missing GitHub secret RENDER_API_KEY"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/srv-dbpb980m7kps73ae4h5g/suspend" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY"
