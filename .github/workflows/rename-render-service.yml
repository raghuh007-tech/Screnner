name: Rename Oldpal Render service

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rename-render-service.yml"

permissions:
  contents: read

jobs:
  rename-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rename Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-dbpb980m7kps73ae4h5g
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RENDER_API_KEY" || {
            echo "Missing GitHub Actions secret RENDER_API_KEY" >&2
            exit 1
          }

          response="$(curl --silent --show-error --fail-with-body \
            --request PATCH \
            --url "https://api.render.com/v1/services/$SERVICE_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"name":"Oldpal F&O Scanner"}')"

          name="$(jq -r '.name // empty' <<<"$response")"
          slug="$(jq -r '.slug // empty' <<<"$response")"
          url="$(jq -r '.serviceDetails.url // empty' <<<"$response")"

          if [[ "$name" != "Oldpal F&O Scanner" ]]; then
            echo "Render did not confirm the requested service name." >&2
            jq '{name,slug,serviceDetails:{url:.serviceDetails.url}}' <<<"$response" >&2
            exit 1
          fi

          {
            echo "## Render service renamed"
            echo ""
            echo "- **Name:** $name"
            echo "- **Slug:** $slug"
            echo "- **URL returned by Render:** $url"
            echo ""
            echo "Update the Zerodha OAuth redirect URI in the Kite developer console to: `$url/callback`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Render service name updated."
          echo "Name: $name"
          echo "Slug: $slug"
          echo "URL: $url"
